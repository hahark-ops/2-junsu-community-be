name: deploy-ec2

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: choice
        options: [dev, prod]
        default: dev
      image_tag:
        description: Optional image tag override
        required: false
        type: string
      rollback_on_fail:
        description: Rollback to last successful tag on failure
        required: true
        type: boolean
        default: true
  workflow_run:
    workflows: ["ci"]
    types: [completed]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-ec2-${{ github.event.workflow_run.head_branch || github.ref_name || 'manual' }}
  cancel-in-progress: true

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        (github.event.workflow_run.head_branch == 'main' || github.event.workflow_run.head_branch == 'develop')
      )
    runs-on: ubuntu-latest
    env:
      FE_REPO: ${{ vars.FE_REPO != '' && vars.FE_REPO || format('{0}/2-junsu-community-fe', github.repository_owner) }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      ECR_REPO_BE: ${{ vars.ECR_REPO_BE }}
      ECR_REPO_FE: ${{ vars.ECR_REPO_FE }}
      ECR_REPO_DB: ${{ vars.ECR_REPO_DB }}
      EC2_DEPLOY_DIR: ${{ vars.EC2_DEPLOY_DIR != '' && vars.EC2_DEPLOY_DIR || '/opt/2-junsu-community-be' }}
      EC2_AUTO_START: ${{ vars.EC2_AUTO_START != '' && vars.EC2_AUTO_START || 'false' }}
      EVENT_NAME: ${{ github.event_name }}
      WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout BE
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Checkout FE
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FE_REPO }}
          ref: main
          path: fe-repo
          token: ${{ secrets.FE_REPO_READ_TOKEN != '' && secrets.FE_REPO_READ_TOKEN || github.token }}

      - name: Resolve deployment variables
        id: resolve
        run: |
          set -euo pipefail

          DEPLOY_ENV="dev"
          TAG_INPUT=""
          ROLLBACK_ON_FAIL="true"
          SOURCE_SHA="${GITHUB_SHA}"

          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            DEPLOY_ENV='${{ inputs.environment }}'
            TAG_INPUT='${{ inputs.image_tag }}'
            ROLLBACK_ON_FAIL='${{ inputs.rollback_on_fail }}'
          elif [ "${EVENT_NAME}" = "workflow_run" ]; then
            if [ -n "${WORKFLOW_RUN_HEAD_SHA}" ]; then
              SOURCE_SHA="${WORKFLOW_RUN_HEAD_SHA}"
            fi
          fi

          RUN_SMOKE="true"
          DB_NAME='${{ vars.DB_NAME != '' && vars.DB_NAME || 'community_db' }}'
          DB_USER='${{ vars.DB_USER != '' && vars.DB_USER || 'community_user' }}'
          UPLOAD_PROVIDER='${{ vars.UPLOAD_PROVIDER != '' && vars.UPLOAD_PROVIDER || 'local' }}'
          UPLOAD_LAMBDA_API_URL='${{ vars.UPLOAD_LAMBDA_API_URL }}'
          S3_BUCKET_NAME='${{ vars.S3_BUCKET_NAME }}'
          S3_OBJECT_PREFIX='${{ vars.S3_OBJECT_PREFIX != '' && vars.S3_OBJECT_PREFIX || 'uploads' }}'
          S3_BASE_URL='${{ vars.S3_BASE_URL }}'

          if [ "${DEPLOY_ENV}" = "prod" ]; then
            ROLE_ARN='${{ secrets.AWS_ROLE_ARN_PROD }}'
            INSTANCE_ID='${{ vars.EC2_INSTANCE_ID_PROXY_PROD }}'
            PARAM_NAME='${{ vars.SSM_PARAM_LAST_TAG_PROD }}'
            QA_EMAIL='${{ secrets.QA_EMAIL_PROD }}'
            QA_PASSWORD='${{ secrets.QA_PASSWORD_PROD }}'
            DB_ROOT_PASSWORD='${{ secrets.MYSQL_ROOT_PASSWORD_PROD }}'
            DB_PASSWORD='${{ secrets.DB_PASSWORD_PROD }}'
          else
            ROLE_ARN='${{ secrets.AWS_ROLE_ARN_DEV }}'
            INSTANCE_ID='${{ vars.EC2_INSTANCE_ID_PROXY_DEV }}'
            PARAM_NAME='${{ vars.SSM_PARAM_LAST_TAG_DEV }}'
            QA_EMAIL='${{ secrets.QA_EMAIL_DEV }}'
            QA_PASSWORD='${{ secrets.QA_PASSWORD_DEV }}'
            DB_ROOT_PASSWORD='${{ secrets.MYSQL_ROOT_PASSWORD_DEV }}'
            DB_PASSWORD='${{ secrets.DB_PASSWORD_DEV }}'
          fi

          if [ -z "${ROLE_ARN}" ] || [ -z "${INSTANCE_ID}" ] || [ -z "${PARAM_NAME}" ]; then
            echo "Missing required environment secrets/variables for ${DEPLOY_ENV}"
            exit 1
          fi

          if [ -z "${DB_ROOT_PASSWORD}" ] || [ -z "${DB_PASSWORD}" ]; then
            echo "Missing DB secrets for ${DEPLOY_ENV}. Set MYSQL_ROOT_PASSWORD_${DEPLOY_ENV^^} and DB_PASSWORD_${DEPLOY_ENV^^}."
            exit 1
          fi

          if [ -z "${QA_EMAIL}" ] || [ -z "${QA_PASSWORD}" ]; then
            if [ "${DEPLOY_ENV}" = "prod" ]; then
              RUN_SMOKE="false"
              echo "QA credentials for prod are missing. deploy only mode."
            else
              echo "QA credentials are required for smoke test"
              exit 1
            fi
          fi

          if [ -n "${TAG_INPUT}" ]; then
            TAG="${TAG_INPUT}"
          else
            TAG="sha-${SOURCE_SHA::7}"
          fi

          printf 'deploy_env=%s\n' "${DEPLOY_ENV}" >> "$GITHUB_OUTPUT"
          printf 'role_arn=%s\n' "${ROLE_ARN}" >> "$GITHUB_OUTPUT"
          printf 'instance_id=%s\n' "${INSTANCE_ID}" >> "$GITHUB_OUTPUT"
          printf 'param_name=%s\n' "${PARAM_NAME}" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "${TAG}" >> "$GITHUB_OUTPUT"
          printf 'source_sha=%s\n' "${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
          printf 'rollback_on_fail=%s\n' "${ROLLBACK_ON_FAIL}" >> "$GITHUB_OUTPUT"
          printf 'qa_email=%s\n' "${QA_EMAIL}" >> "$GITHUB_OUTPUT"
          printf 'qa_password=%s\n' "${QA_PASSWORD}" >> "$GITHUB_OUTPUT"
          printf 'run_smoke=%s\n' "${RUN_SMOKE}" >> "$GITHUB_OUTPUT"
          printf 'db_name=%s\n' "${DB_NAME}" >> "$GITHUB_OUTPUT"
          printf 'db_user=%s\n' "${DB_USER}" >> "$GITHUB_OUTPUT"
          printf 'db_root_password=%s\n' "${DB_ROOT_PASSWORD}" >> "$GITHUB_OUTPUT"
          printf 'db_password=%s\n' "${DB_PASSWORD}" >> "$GITHUB_OUTPUT"
          printf 'upload_provider=%s\n' "${UPLOAD_PROVIDER}" >> "$GITHUB_OUTPUT"
          printf 'upload_lambda_api_url=%s\n' "${UPLOAD_LAMBDA_API_URL}" >> "$GITHUB_OUTPUT"
          printf 's3_bucket_name=%s\n' "${S3_BUCKET_NAME}" >> "$GITHUB_OUTPUT"
          printf 's3_object_prefix=%s\n' "${S3_OBJECT_PREFIX}" >> "$GITHUB_OUTPUT"
          printf 's3_base_url=%s\n' "${S3_BASE_URL}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.resolve.outputs.role_arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve previous successful tag
        id: prev
        run: |
          set -euo pipefail
          PREV_TAG=""
          if aws ssm get-parameter --name "${{ steps.resolve.outputs.param_name }}" --region "${AWS_REGION}" >/dev/null 2>&1; then
            PREV_TAG="$(aws ssm get-parameter --name "${{ steps.resolve.outputs.param_name }}" --region "${AWS_REGION}" --query 'Parameter.Value' --output text)"
          fi
          echo "prev_tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"

      - name: Ensure target EC2 is ready for deployment
        id: ec2_ready
        run: |
          set -euo pipefail

          INSTANCE_ID="${{ steps.resolve.outputs.instance_id }}"
          AUTO_START="${EC2_AUTO_START}"

          STATE="$(aws ec2 describe-instances \
            --region "${AWS_REGION}" \
            --instance-ids "${INSTANCE_ID}" \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text 2>/dev/null || true)"

          if [ -z "${STATE}" ] || [ "${STATE}" = "None" ] || [ "${STATE}" = "terminated" ]; then
            echo "Invalid EC2 instance id for deploy: ${INSTANCE_ID} (state=${STATE})"
            echo "Update EC2_INSTANCE_ID_PROXY_DEV/PROD to a valid instance id."
            exit 1
          fi

          if [ "${STATE}" = "stopped" ]; then
            if [ "${EVENT_NAME}" = "workflow_dispatch" ] && [ "${AUTO_START}" = "true" ]; then
              echo "Instance is stopped. Starting ${INSTANCE_ID}..."
              aws ec2 start-instances --region "${AWS_REGION}" --instance-ids "${INSTANCE_ID}" >/dev/null
              aws ec2 wait instance-running --region "${AWS_REGION}" --instance-ids "${INSTANCE_ID}"
            else
              echo "Instance is stopped. Auto-start is disabled for this run (event=${EVENT_NAME}, EC2_AUTO_START=${AUTO_START})."
              echo "Start the instance manually, then rerun deployment."
              exit 1
            fi
          elif [ "${STATE}" = "pending" ] || [ "${STATE}" = "stopping" ]; then
            echo "Instance state is ${STATE}. Waiting until running..."
            aws ec2 wait instance-running --region "${AWS_REGION}" --instance-ids "${INSTANCE_ID}"
          fi

          echo "Waiting for SSM online..."
          ONLINE="false"
          for _ in $(seq 1 30); do
            PING_STATUS="$(aws ssm describe-instance-information \
              --region "${AWS_REGION}" \
              --filters "Key=InstanceIds,Values=${INSTANCE_ID}" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text 2>/dev/null || true)"
            if [ "${PING_STATUS}" = "Online" ]; then
              ONLINE="true"
              break
            fi
            sleep 10
          done

          if [ "${ONLINE}" != "true" ]; then
            echo "SSM is not online for instance ${INSTANCE_ID}"
            exit 1
          fi

      - name: Build and push BE/FE/DB images
        env:
          REGISTRY: ${{ env.ECR_REGISTRY }}
          TAG: ${{ steps.resolve.outputs.tag }}
          FE_DIR: ${{ github.workspace }}/fe-repo
          PLATFORM: linux/amd64
        run: ./scripts/push_images.sh

      - name: Compose image URIs
        id: img
        run: |
          set -euo pipefail
          echo "be_image=${ECR_REGISTRY}/${ECR_REPO_BE}:${{ steps.resolve.outputs.tag }}" >> "$GITHUB_OUTPUT"
          echo "fe_image=${ECR_REGISTRY}/${ECR_REPO_FE}:${{ steps.resolve.outputs.tag }}" >> "$GITHUB_OUTPUT"
          echo "db_image=${ECR_REGISTRY}/${ECR_REPO_DB}:${{ steps.resolve.outputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Deploy to EC2 via SSM
        id: ssm_deploy
        run: |
          set -euo pipefail

          PARAMS_JSON="$(mktemp)"
          jq -n \
            --arg deploy_dir "${EC2_DEPLOY_DIR}" \
            --arg repo_url "https://github.com/${{ github.repository }}.git" \
            --arg aws_region "${AWS_REGION}" \
            --arg registry "${ECR_REGISTRY}" \
            --arg commit_sha "${{ steps.resolve.outputs.source_sha }}" \
            --arg be_image "${{ steps.img.outputs.be_image }}" \
            --arg fe_image "${{ steps.img.outputs.fe_image }}" \
            --arg db_image "${{ steps.img.outputs.db_image }}" \
            --arg db_name "${{ steps.resolve.outputs.db_name }}" \
            --arg db_user "${{ steps.resolve.outputs.db_user }}" \
            --arg db_root_password "${{ steps.resolve.outputs.db_root_password }}" \
            --arg db_password "${{ steps.resolve.outputs.db_password }}" \
            --arg upload_provider "${{ steps.resolve.outputs.upload_provider }}" \
            --arg upload_lambda_api_url "${{ steps.resolve.outputs.upload_lambda_api_url }}" \
            --arg s3_bucket_name "${{ steps.resolve.outputs.s3_bucket_name }}" \
            --arg s3_object_prefix "${{ steps.resolve.outputs.s3_object_prefix }}" \
            --arg s3_base_url "${{ steps.resolve.outputs.s3_base_url }}" \
            --arg qa_email "${{ steps.resolve.outputs.qa_email }}" \
            --arg qa_password "${{ steps.resolve.outputs.qa_password }}" \
            --arg qa_nickname "awsai-ci-${{ github.run_id }}" \
            --arg run_smoke "${{ steps.resolve.outputs.run_smoke }}" \
            '{commands:[
              "set -euo pipefail",
              "if ! command -v git >/dev/null 2>&1; then if command -v dnf >/dev/null 2>&1; then dnf install -y git; elif command -v apt-get >/dev/null 2>&1; then apt-get update -y && apt-get install -y git; else echo \"git 설치 실패\"; exit 1; fi; fi",
              "if [ ! -d \"" + $deploy_dir + "/.git\" ]; then mkdir -p $(dirname \"" + $deploy_dir + "\"); git clone " + $repo_url + " \"" + $deploy_dir + "\"; fi",
              "cd " + $deploy_dir,
              "[ -n \"${HOME:-}\" ] || export HOME=/root",
              "git config --global --add safe.directory " + $deploy_dir,
              "git fetch --all --prune",
              "git checkout -f " + $commit_sha,
              "git reset --hard " + $commit_sha,
              "if [ ! -f deploy.proxy.env ]; then if [ -f deploy.proxy.env.example ]; then cp deploy.proxy.env.example deploy.proxy.env; else echo \"deploy.proxy.env.example 파일이 없습니다\"; exit 1; fi; fi",
              "aws ecr get-login-password --region " + $aws_region + " | docker login --username AWS --password-stdin " + $registry,
              "if ! docker compose version >/dev/null 2>&1 && ! command -v docker-compose >/dev/null 2>&1; then if command -v dnf >/dev/null 2>&1; then (dnf install -y docker-compose-plugin || dnf install -y docker-compose || true); elif command -v apt-get >/dev/null 2>&1; then (apt-get update -y && (apt-get install -y docker-compose-plugin || apt-get install -y docker-compose) || true); fi; fi",
              "if ! docker compose version >/dev/null 2>&1 && ! command -v docker-compose >/dev/null 2>&1; then ARCH=$(uname -m); BIN=docker-compose-linux-x86_64; if [ \"$ARCH\" = \"aarch64\" ] || [ \"$ARCH\" = \"arm64\" ]; then BIN=docker-compose-linux-aarch64; fi; curl -fsSL \"https://github.com/docker/compose/releases/download/v2.27.0/${BIN}\" -o /usr/local/bin/docker-compose && chmod +x /usr/local/bin/docker-compose; fi",
              "if ! docker compose version >/dev/null 2>&1 && ! command -v docker-compose >/dev/null 2>&1; then echo \"docker compose 설치 실패\"; exit 1; fi",
              "grep -q \"^BE_IMAGE=\" deploy.proxy.env && sed -i \"s#^BE_IMAGE=.*#BE_IMAGE=" + $be_image + "#\" deploy.proxy.env || echo \"BE_IMAGE=" + $be_image + "\" >> deploy.proxy.env",
              "grep -q \"^FE_IMAGE=\" deploy.proxy.env && sed -i \"s#^FE_IMAGE=.*#FE_IMAGE=" + $fe_image + "#\" deploy.proxy.env || echo \"FE_IMAGE=" + $fe_image + "\" >> deploy.proxy.env",
              "grep -q \"^DB_IMAGE=\" deploy.proxy.env && sed -i \"s#^DB_IMAGE=.*#DB_IMAGE=" + $db_image + "#\" deploy.proxy.env || echo \"DB_IMAGE=" + $db_image + "\" >> deploy.proxy.env",
              "MYSQL_ROOT_PASSWORD=\"" + $db_root_password + "\" DB_NAME=\"" + $db_name + "\" DB_USER=\"" + $db_user + "\" DB_PASSWORD=\"" + $db_password + "\" CORS_ALLOW_ORIGINS=\"http://localhost,http://127.0.0.1\" AWS_REGION=\"" + $aws_region + "\" UPLOAD_PROVIDER=\"" + $upload_provider + "\" UPLOAD_LAMBDA_API_URL=\"" + $upload_lambda_api_url + "\" S3_BUCKET_NAME=\"" + $s3_bucket_name + "\" S3_OBJECT_PREFIX=\"" + $s3_object_prefix + "\" S3_BASE_URL=\"" + $s3_base_url + "\" ./scripts/ensure_deploy_proxy_env.sh deploy.proxy.env",
              "./scripts/proxy_up_single_ec2.sh " + $deploy_dir + "/deploy.proxy.env",
              "if [ \"" + $run_smoke + "\" = \"true\" ]; then BASE_URL=http://127.0.0.1 QA_EMAIL=\"" + $qa_email + "\" QA_PASSWORD=\"" + $qa_password + "\" QA_NICKNAME=\"" + $qa_nickname + "\" ./scripts/qa_ec2_smoke.sh; else echo \"Smoke skipped (prod optional credentials)\"; fi"
            ]}' > "$PARAMS_JSON"

          COMMAND_ID="$(aws ssm send-command \
            --region "${AWS_REGION}" \
            --instance-ids "${{ steps.resolve.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --comment "community deploy ${{ steps.resolve.outputs.tag }}" \
            --parameters "file://${PARAMS_JSON}" \
            --query 'Command.CommandId' \
            --output text)"

          echo "command_id=${COMMAND_ID}" >> "$GITHUB_OUTPUT"
          STATUS="InProgress"
          MAX_POLLS=180
          SLEEP_SECONDS=10
          for i in $(seq 1 "${MAX_POLLS}"); do
            STATUS="$(aws ssm get-command-invocation \
              --region "${AWS_REGION}" \
              --command-id "${COMMAND_ID}" \
              --instance-id "${{ steps.resolve.outputs.instance_id }}" \
              --query 'Status' \
              --output text 2>/dev/null || echo "InProgress")"
            echo "SSM deploy status=${STATUS} (${i}/${MAX_POLLS})"
            case "${STATUS}" in
              Success|Cancelled|TimedOut|Failed|Cancelling|DeliveryTimedOut|ExecutionTimedOut)
                break
                ;;
            esac
            sleep "${SLEEP_SECONDS}"
          done

          echo "deploy_status=${STATUS}" >> "$GITHUB_OUTPUT"

          if [ "${STATUS}" != "Success" ]; then
            if [ "${STATUS}" = "InProgress" ] || [ "${STATUS}" = "Pending" ] || [ "${STATUS}" = "Delayed" ]; then
              echo "SSM deploy timeout while status=${STATUS}"
            else
              echo "SSM deploy failed with status=${STATUS}"
            fi
            aws ssm get-command-invocation \
              --region "${AWS_REGION}" \
              --command-id "${COMMAND_ID}" \
              --instance-id "${{ steps.resolve.outputs.instance_id }}" \
              --query '{Status:Status,StdOut:StandardOutputContent,StdErr:StandardErrorContent}' || true
            exit 1
          fi

      - name: Save successful tag
        if: ${{ success() }}
        run: |
          aws ssm put-parameter \
            --region "${AWS_REGION}" \
            --name "${{ steps.resolve.outputs.param_name }}" \
            --type String \
            --value "${{ steps.resolve.outputs.tag }}" \
            --overwrite

      - name: Rollback on failure
        if: ${{ failure() && steps.resolve.outputs.rollback_on_fail == 'true' && steps.ssm_deploy.outcome == 'failure' && steps.ssm_deploy.outputs.deploy_status != 'InProgress' && steps.ssm_deploy.outputs.deploy_status != 'Pending' && steps.ssm_deploy.outputs.deploy_status != 'Delayed' }}
        run: |
          set -euo pipefail

          PREV_TAG='${{ steps.prev.outputs.prev_tag }}'
          if [ -z "${PREV_TAG}" ]; then
            echo "No previous tag found. Skip rollback."
            exit 0
          fi

          INSTANCE_ID="${{ steps.resolve.outputs.instance_id }}"
          STATE="$(aws ec2 describe-instances \
            --region "${AWS_REGION}" \
            --instance-ids "${INSTANCE_ID}" \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text 2>/dev/null || true)"
          if [ "${STATE}" = "stopped" ] || [ "${STATE}" = "stopping" ]; then
            aws ec2 start-instances --region "${AWS_REGION}" --instance-ids "${INSTANCE_ID}" >/dev/null
            aws ec2 wait instance-running --region "${AWS_REGION}" --instance-ids "${INSTANCE_ID}"
          fi

          PREV_BE_IMAGE="${ECR_REGISTRY}/${ECR_REPO_BE}:${PREV_TAG}"
          PREV_FE_IMAGE="${ECR_REGISTRY}/${ECR_REPO_FE}:${PREV_TAG}"
          PREV_DB_IMAGE="${ECR_REGISTRY}/${ECR_REPO_DB}:${PREV_TAG}"

          PARAMS_JSON="$(mktemp)"
          jq -n \
            --arg deploy_dir "${EC2_DEPLOY_DIR}" \
            --arg repo_url "https://github.com/${{ github.repository }}.git" \
            --arg aws_region "${AWS_REGION}" \
            --arg registry "${ECR_REGISTRY}" \
            --arg commit_sha "${{ steps.resolve.outputs.source_sha }}" \
            --arg be_image "${PREV_BE_IMAGE}" \
            --arg fe_image "${PREV_FE_IMAGE}" \
            --arg db_image "${PREV_DB_IMAGE}" \
            --arg db_name "${{ steps.resolve.outputs.db_name }}" \
            --arg db_user "${{ steps.resolve.outputs.db_user }}" \
            --arg db_root_password "${{ steps.resolve.outputs.db_root_password }}" \
            --arg db_password "${{ steps.resolve.outputs.db_password }}" \
            --arg upload_provider "${{ steps.resolve.outputs.upload_provider }}" \
            --arg upload_lambda_api_url "${{ steps.resolve.outputs.upload_lambda_api_url }}" \
            --arg s3_bucket_name "${{ steps.resolve.outputs.s3_bucket_name }}" \
            --arg s3_object_prefix "${{ steps.resolve.outputs.s3_object_prefix }}" \
            --arg s3_base_url "${{ steps.resolve.outputs.s3_base_url }}" \
            '{commands:[
              "set -euo pipefail",
              "if ! command -v git >/dev/null 2>&1; then if command -v dnf >/dev/null 2>&1; then dnf install -y git; elif command -v apt-get >/dev/null 2>&1; then apt-get update -y && apt-get install -y git; else echo \"git 설치 실패\"; exit 1; fi; fi",
              "if [ ! -d \"" + $deploy_dir + "/.git\" ]; then mkdir -p $(dirname \"" + $deploy_dir + "\"); git clone " + $repo_url + " \"" + $deploy_dir + "\"; fi",
              "cd " + $deploy_dir,
              "[ -n \"${HOME:-}\" ] || export HOME=/root",
              "git config --global --add safe.directory " + $deploy_dir,
              "git fetch --all --prune",
              "git checkout -f " + $commit_sha,
              "git reset --hard " + $commit_sha,
              "if [ ! -f deploy.proxy.env ]; then if [ -f deploy.proxy.env.example ]; then cp deploy.proxy.env.example deploy.proxy.env; else echo \"deploy.proxy.env.example 파일이 없습니다\"; exit 1; fi; fi",
              "aws ecr get-login-password --region " + $aws_region + " | docker login --username AWS --password-stdin " + $registry,
              "if ! docker compose version >/dev/null 2>&1 && ! command -v docker-compose >/dev/null 2>&1; then if command -v dnf >/dev/null 2>&1; then (dnf install -y docker-compose-plugin || dnf install -y docker-compose || true); elif command -v apt-get >/dev/null 2>&1; then (apt-get update -y && (apt-get install -y docker-compose-plugin || apt-get install -y docker-compose) || true); fi; fi",
              "if ! docker compose version >/dev/null 2>&1 && ! command -v docker-compose >/dev/null 2>&1; then ARCH=$(uname -m); BIN=docker-compose-linux-x86_64; if [ \"$ARCH\" = \"aarch64\" ] || [ \"$ARCH\" = \"arm64\" ]; then BIN=docker-compose-linux-aarch64; fi; curl -fsSL \"https://github.com/docker/compose/releases/download/v2.27.0/${BIN}\" -o /usr/local/bin/docker-compose && chmod +x /usr/local/bin/docker-compose; fi",
              "if ! docker compose version >/dev/null 2>&1 && ! command -v docker-compose >/dev/null 2>&1; then echo \"docker compose 설치 실패\"; exit 1; fi",
              "grep -q \"^BE_IMAGE=\" deploy.proxy.env && sed -i \"s#^BE_IMAGE=.*#BE_IMAGE=" + $be_image + "#\" deploy.proxy.env || echo \"BE_IMAGE=" + $be_image + "\" >> deploy.proxy.env",
              "grep -q \"^FE_IMAGE=\" deploy.proxy.env && sed -i \"s#^FE_IMAGE=.*#FE_IMAGE=" + $fe_image + "#\" deploy.proxy.env || echo \"FE_IMAGE=" + $fe_image + "\" >> deploy.proxy.env",
              "grep -q \"^DB_IMAGE=\" deploy.proxy.env && sed -i \"s#^DB_IMAGE=.*#DB_IMAGE=" + $db_image + "#\" deploy.proxy.env || echo \"DB_IMAGE=" + $db_image + "\" >> deploy.proxy.env",
              "MYSQL_ROOT_PASSWORD=\"" + $db_root_password + "\" DB_NAME=\"" + $db_name + "\" DB_USER=\"" + $db_user + "\" DB_PASSWORD=\"" + $db_password + "\" CORS_ALLOW_ORIGINS=\"http://localhost,http://127.0.0.1\" AWS_REGION=\"" + $aws_region + "\" UPLOAD_PROVIDER=\"" + $upload_provider + "\" UPLOAD_LAMBDA_API_URL=\"" + $upload_lambda_api_url + "\" S3_BUCKET_NAME=\"" + $s3_bucket_name + "\" S3_OBJECT_PREFIX=\"" + $s3_object_prefix + "\" S3_BASE_URL=\"" + $s3_base_url + "\" ./scripts/ensure_deploy_proxy_env.sh deploy.proxy.env",
              "./scripts/proxy_up_single_ec2.sh " + $deploy_dir + "/deploy.proxy.env"
            ]}' > "$PARAMS_JSON"

          COMMAND_ID="$(aws ssm send-command \
            --region "${AWS_REGION}" \
            --instance-ids "${{ steps.resolve.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --comment "community rollback ${PREV_TAG}" \
            --parameters "file://${PARAMS_JSON}" \
            --query 'Command.CommandId' \
            --output text)"
          STATUS="InProgress"
          MAX_POLLS=180
          SLEEP_SECONDS=10
          for i in $(seq 1 "${MAX_POLLS}"); do
            STATUS="$(aws ssm get-command-invocation \
              --region "${AWS_REGION}" \
              --command-id "${COMMAND_ID}" \
              --instance-id "${{ steps.resolve.outputs.instance_id }}" \
              --query 'Status' \
              --output text 2>/dev/null || echo "InProgress")"
            echo "SSM rollback status=${STATUS} (${i}/${MAX_POLLS})"
            case "${STATUS}" in
              Success|Cancelled|TimedOut|Failed|Cancelling|DeliveryTimedOut|ExecutionTimedOut)
                break
                ;;
            esac
            sleep "${SLEEP_SECONDS}"
          done

          aws ssm get-command-invocation \
            --region "${AWS_REGION}" \
            --command-id "${COMMAND_ID}" \
            --instance-id "${{ steps.resolve.outputs.instance_id }}" \
            --query '{Status:Status,StdOut:StandardOutputContent,StdErr:StandardErrorContent}' || true

          if [ "${STATUS}" != "Success" ]; then
            echo "Rollback failed with status=${STATUS}"
            exit 1
          fi
