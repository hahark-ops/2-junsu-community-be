name: deploy-ecs

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: choice
        options: [dev, prod]
        default: dev
      image_tag:
        description: Optional image tag override
        required: false
        type: string
      keep_running:
        description: Keep ECS service desired count after verification
        required: true
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      ECR_REPO_BE: ${{ vars.ECR_REPO_BE }}
    steps:
      - name: Checkout BE
        uses: actions/checkout@v4

      - name: Resolve variables
        id: resolve
        run: |
          set -euo pipefail

          if [ "${{ inputs.environment }}" = "prod" ]; then
            ROLE_ARN='${{ secrets.AWS_ROLE_ARN_PROD }}'
            ECS_CLUSTER='${{ vars.ECS_CLUSTER_NAME_PROD }}'
            ECS_SERVICE='${{ vars.ECS_SERVICE_NAME_PROD }}'
            ECS_TASK_FAMILY='${{ vars.ECS_TASK_FAMILY_PROD }}'
            ECS_TARGET_GROUP_ARN='${{ vars.ECS_TARGET_GROUP_ARN_PROD }}'
          else
            ROLE_ARN='${{ secrets.AWS_ROLE_ARN_DEV }}'
            ECS_CLUSTER='${{ vars.ECS_CLUSTER_NAME_DEV }}'
            ECS_SERVICE='${{ vars.ECS_SERVICE_NAME_DEV }}'
            ECS_TASK_FAMILY='${{ vars.ECS_TASK_FAMILY_DEV }}'
            ECS_TARGET_GROUP_ARN='${{ vars.ECS_TARGET_GROUP_ARN_DEV }}'
          fi

          if [ -z "${ROLE_ARN}" ] || [ -z "${ECS_CLUSTER}" ] || [ -z "${ECS_SERVICE}" ] || [ -z "${ECS_TASK_FAMILY}" ] || [ -z "${ECS_TARGET_GROUP_ARN}" ]; then
            echo "Missing required ECS deployment variables for ${{ inputs.environment }}"
            exit 1
          fi

          TAG_INPUT='${{ inputs.image_tag }}'
          if [ -n "${TAG_INPUT}" ]; then
            TAG="${TAG_INPUT}"
          else
            TAG="sha-${GITHUB_SHA::7}"
          fi

          echo "role_arn=${ROLE_ARN}" >> "$GITHUB_OUTPUT"
          echo "ecs_cluster=${ECS_CLUSTER}" >> "$GITHUB_OUTPUT"
          echo "ecs_service=${ECS_SERVICE}" >> "$GITHUB_OUTPUT"
          echo "ecs_task_family=${ECS_TASK_FAMILY}" >> "$GITHUB_OUTPUT"
          echo "ecs_target_group_arn=${ECS_TARGET_GROUP_ARN}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.resolve.outputs.role_arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push BE image
        id: image
        run: |
          set -euo pipefail
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPO_BE}:${{ steps.resolve.outputs.tag }}"
          docker build -f Dockerfile -t "${IMAGE_URI}" .
          docker push "${IMAGE_URI}"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Capture previous task definition
        id: prev
        run: |
          set -euo pipefail
          OLD_TASK_DEF="$(aws ecs describe-services \
            --cluster "${{ steps.resolve.outputs.ecs_cluster }}" \
            --services "${{ steps.resolve.outputs.ecs_service }}" \
            --query 'services[0].taskDefinition' \
            --output text)"
          echo "old_task_def=${OLD_TASK_DEF}" >> "$GITHUB_OUTPUT"

      - name: Register new task definition
        id: taskdef
        run: |
          set -euo pipefail

          aws ecs describe-task-definition \
            --task-definition "${{ steps.resolve.outputs.ecs_task_family }}" \
            --query taskDefinition > taskdef.json

          jq --arg IMAGE "${{ steps.image.outputs.image_uri }}" '
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )
            | .containerDefinitions[0].image = $IMAGE
          ' taskdef.json > taskdef-new.json

          NEW_TASK_DEF_ARN="$(aws ecs register-task-definition \
            --cli-input-json file://taskdef-new.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)"

          echo "new_task_def=${NEW_TASK_DEF_ARN}" >> "$GITHUB_OUTPUT"

      - name: Update ECS service
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster "${{ steps.resolve.outputs.ecs_cluster }}" \
            --service "${{ steps.resolve.outputs.ecs_service }}" \
            --task-definition "${{ steps.taskdef.outputs.new_task_def }}" \
            --force-new-deployment >/dev/null

          aws ecs wait services-stable \
            --cluster "${{ steps.resolve.outputs.ecs_cluster }}" \
            --services "${{ steps.resolve.outputs.ecs_service }}"

      - name: ALB target health check
        run: |
          set -euo pipefail
          STATES="$(aws elbv2 describe-target-health \
            --target-group-arn "${{ steps.resolve.outputs.ecs_target_group_arn }}" \
            --query 'TargetHealthDescriptions[].TargetHealth.State' \
            --output text)"

          echo "Target states: ${STATES}"
          if ! echo "${STATES}" | grep -q "healthy"; then
            echo "No healthy targets found"
            exit 1
          fi

      - name: Scale down ECS service (dev only)
        if: ${{ inputs.environment == 'dev' && !inputs.keep_running }}
        run: |
          aws ecs update-service \
            --cluster "${{ steps.resolve.outputs.ecs_cluster }}" \
            --service "${{ steps.resolve.outputs.ecs_service }}" \
            --desired-count 0 >/dev/null

      - name: Rollback on failure
        if: ${{ failure() }}
        run: |
          set -euo pipefail
          OLD_TASK_DEF='${{ steps.prev.outputs.old_task_def }}'
          if [ -z "${OLD_TASK_DEF}" ] || [ "${OLD_TASK_DEF}" = "None" ]; then
            echo "No previous task definition found. Skip rollback."
            exit 0
          fi

          aws ecs update-service \
            --cluster "${{ steps.resolve.outputs.ecs_cluster }}" \
            --service "${{ steps.resolve.outputs.ecs_service }}" \
            --task-definition "${OLD_TASK_DEF}" \
            --force-new-deployment >/dev/null

          aws ecs wait services-stable \
            --cluster "${{ steps.resolve.outputs.ecs_cluster }}" \
            --services "${{ steps.resolve.outputs.ecs_service }}"
