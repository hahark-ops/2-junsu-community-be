name: ci

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  python-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BE
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Python compile check
        run: python -m compileall -q .

  compose-config:
    runs-on: ubuntu-latest
    env:
      FE_REPO: ${{ vars.FE_REPO != '' && vars.FE_REPO || format('{0}/2-junsu-community-fe', github.repository_owner) }}
    steps:
      - name: Checkout BE
        uses: actions/checkout@v4

      - name: Resolve FE ref
        id: fe_ref
        run: |
          set -euo pipefail
          FE_REF="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            FE_REF="${GITHUB_HEAD_REF}"
          fi
          echo "fe_ref=${FE_REF}" >> "$GITHUB_OUTPUT"

      - name: Checkout FE
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FE_REPO }}
          ref: ${{ steps.fe_ref.outputs.fe_ref }}
          path: fe-repo
          token: ${{ secrets.FE_REPO_READ_TOKEN != '' && secrets.FE_REPO_READ_TOKEN || github.token }}

      - name: Record FE source metadata
        run: |
          set -euo pipefail
          git -C fe-repo rev-parse HEAD > fe-source-sha.txt
          printf '%s\n' '${{ steps.fe_ref.outputs.fe_ref }}' > fe-source-ref.txt

      - name: Upload CI metadata
        uses: actions/upload-artifact@v4
        with:
          name: ci-metadata
          path: |
            fe-source-sha.txt
            fe-source-ref.txt

      - name: Validate local compose config
        env:
          FE_REPO_PATH: ${{ github.workspace }}/fe-repo
        run: docker compose -f docker-compose.yml config >/dev/null

      - name: Validate reverse proxy compose config
        run: docker compose --env-file deploy.proxy.env.example -f docker-compose.reverse-proxy.yml config >/dev/null

  smoke-test:
    needs: [python-compile, compose-config]
    runs-on: ubuntu-latest
    env:
      FE_REPO: ${{ vars.FE_REPO != '' && vars.FE_REPO || format('{0}/2-junsu-community-fe', github.repository_owner) }}
    steps:
      - name: Checkout BE
        uses: actions/checkout@v4

      - name: Resolve FE ref
        id: fe_ref
        run: |
          set -euo pipefail
          FE_REF="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            FE_REF="${GITHUB_HEAD_REF}"
          fi
          echo "fe_ref=${FE_REF}" >> "$GITHUB_OUTPUT"

      - name: Checkout FE
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FE_REPO }}
          ref: ${{ steps.fe_ref.outputs.fe_ref }}
          path: fe-repo
          token: ${{ secrets.FE_REPO_READ_TOKEN != '' && secrets.FE_REPO_READ_TOKEN || github.token }}

      - name: Start local stack for smoke test
        env:
          FE_REPO_PATH: ${{ github.workspace }}/fe-repo
        run: |
          docker compose up -d --build
          ./scripts/run_migrations.sh "${GITHUB_WORKSPACE}/docker-compose.yml"

      - name: Run API smoke tests
        run: |
          QA_EMAIL=ci-bootstrap@example.com \
          QA_PASSWORD='Qa!12345Aa' \
          QA_NICKNAME="ci${GITHUB_RUN_ID}" \
          BASE_URL=http://127.0.0.1 \
          ./scripts/qa_ec2_smoke.sh

      - name: Teardown local stack
        if: ${{ always() }}
        run: docker compose down -v --remove-orphans
