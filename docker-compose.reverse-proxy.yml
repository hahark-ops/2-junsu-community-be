name: community-single-ec2

services:
  redis:
    image: redis:7-alpine
    container_name: community-redis
    restart: unless-stopped
    networks:
      - community-net

  db:
    image: ${DB_IMAGE}
    container_name: community-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - community-net

  be:
    image: ${BE_IMAGE}
    container_name: community-be
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_POOL_NAME: community_pool
      DB_POOL_SIZE: 5
      REDIS_URL: ${REDIS_URL}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS}
      COOKIE_SECURE: ${COOKIE_SECURE}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE}
      COOKIE_MAX_AGE: ${COOKIE_MAX_AGE}
      MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES}
      MAX_PROFILE_UPLOAD_SIZE_BYTES: ${MAX_PROFILE_UPLOAD_SIZE_BYTES}
      MAX_POST_UPLOAD_SIZE_BYTES: ${MAX_POST_UPLOAD_SIZE_BYTES}
      UPLOAD_PROVIDER: ${UPLOAD_PROVIDER}
      UPLOAD_DIR: uploads
      UPLOAD_LAMBDA_API_URL: ${UPLOAD_LAMBDA_API_URL}
      UPLOAD_INTERNAL_TOKEN: ${UPLOAD_INTERNAL_TOKEN}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_OBJECT_PREFIX: ${S3_OBJECT_PREFIX}
      S3_BASE_URL: ${S3_BASE_URL}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS}
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY}
      WEB_PUSH_SUBJECT: ${WEB_PUSH_SUBJECT}
    expose:
      - "8000"
    volumes:
      - be_uploads:/app/uploads
    networks:
      - community-net

  fe:
    image: ${FE_IMAGE}
    container_name: community-fe
    restart: unless-stopped
    depends_on:
      be:
        condition: service_started
    environment:
      PORT: 3000
      BACKEND_TARGET: http://be:8000
    expose:
      - "3000"
    networks:
      - community-net

  nginx:
    image: nginx:1.27-alpine
    container_name: community-nginx
    restart: unless-stopped
    depends_on:
      fe:
        condition: service_started
      be:
        condition: service_started
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - community-net

volumes:
  db_data:
  be_uploads:

networks:
  community-net:
