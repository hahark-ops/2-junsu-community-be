apiVersion: apps/v1
kind: Deployment
metadata:
  name: community-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: community-redis
  template:
    metadata:
      labels:
        app: community-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: community-redis
spec:
  selector:
    app: community-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  type: ClusterIP
