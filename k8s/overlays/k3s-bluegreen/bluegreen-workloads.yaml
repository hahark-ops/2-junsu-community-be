apiVersion: apps/v1
kind: Deployment
metadata:
  name: community-fe-blue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: community-fe
      active: blue
  template:
    metadata:
      labels:
        app: community-fe
        active: blue
    spec:
      imagePullSecrets:
        - name: community-ecr-pull
      containers:
        - name: fe
          image: __FE_IMAGE__
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: BACKEND_TARGET
              value: http://community-be:8000
          readinessProbe:
            httpGet:
              path: /login.html
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /login.html
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
---
