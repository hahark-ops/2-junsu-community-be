name: community-portainer-local

services:
  registry:
    image: registry:2
    container_name: community-local-registry
    restart: unless-stopped
    ports:
      - "${REGISTRY_PORT:-5000}:5000"
    environment:
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: Registry Realm
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - registry_data:/var/lib/registry
      - ./local/portainer/auth:/auth:ro

  portainer:
    image: portainer/portainer-ce:lts
    container_name: community-portainer
    restart: unless-stopped
    command:
      - -H
      - unix:///var/run/docker.sock
      - --http-disabled
      - --sslcert
      - /certs/portainer.crt
      - --sslkey
      - /certs/portainer.key
    ports:
      - "${PORTAINER_HTTPS_PORT:-9443}:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
      - ./local/portainer/certs:/certs:ro
    depends_on:
      - registry

volumes:
  portainer_data:
  registry_data:
