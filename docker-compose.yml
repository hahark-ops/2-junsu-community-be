name: community-local

services:
  db:
    build:
      context: .
      dockerfile: docker/db.Dockerfile
    image: community-db:local
    container_name: community-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: community_db
      MYSQL_USER: community_user
      MYSQL_PASSWORD: community_password
      TZ: Asia/Seoul
    expose:
      - "3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  be:
    build:
      context: .
      dockerfile: Dockerfile
    image: community-be:local
    container_name: community-be
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.docker
    expose:
      - "8000"
    volumes:
      - be_uploads:/app/uploads

  fe:
    build:
      context: ${FE_REPO_PATH:-../2-junsu-community-fe}
      dockerfile: Dockerfile
    image: community-fe:local
    container_name: community-fe
    restart: unless-stopped
    depends_on:
      be:
        condition: service_started
    environment:
      PORT: "3000"
      BACKEND_TARGET: http://be:8000
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: community-nginx
    restart: unless-stopped
    depends_on:
      fe:
        condition: service_started
      be:
        condition: service_started
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  db_data:
  be_uploads:
